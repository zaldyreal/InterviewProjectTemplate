server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Angular is a single-page app: the browser owns the routes. Without this fallback, loading
    # /admin directly — or refreshing it — asks nginx for a file that does not exist and returns 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed bundle filenames change whenever content changes, so they are safe to cache
    # indefinitely.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html must never be cached, or a returning visitor keeps loading a stale bundle
    # reference after a deployment.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
